name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VITE_BASE_URL_API: http://localhost:3000
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-key

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter web lint

      - name: Typecheck API
        run: pnpm --filter ecommerce-monorepo exec tsc --noEmit

      - name: Typecheck web
        run: pnpm --filter web exec tsc -b

      - name: Test API
        run: pnpm --filter ecommerce-monorepo test

      - name: Build
        run: pnpm run build

      - name: Security audit
        run: pnpm audit --audit-level high
        continue-on-error: true

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e

            if [ "${{ secrets.VPS_USER }}" = "root" ]; then
              cd /root/e-commerce
            else
              cd /home/${{ secrets.VPS_USER }}/e-commerce
            fi

            git pull origin main

            cat > .env << 'ENVEOF'
            VITE_BASE_URL_API=${{ secrets.VITE_BASE_URL_API }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            ENVEOF

            docker compose up -d --build --remove-orphans

            echo "Đợi API container healthy..."
            RETRIES=0
            MAX_RETRIES=10
            until [ $RETRIES -ge $MAX_RETRIES ]; do
              if wget -q --spider http://localhost:3000/products 2>/dev/null; then
                echo "API health check passed!"
                break
              fi
              RETRIES=$((RETRIES + 1))
              echo "Đang chờ API... ($RETRIES/$MAX_RETRIES)"
              sleep 5
            done

            if [ $RETRIES -ge $MAX_RETRIES ]; then
              echo "API health check failed! Kiểm tra logs:"
              docker compose logs --tail=30 api
              exit 1
            fi

            docker image prune -f
            echo "Deploy thành công!"
